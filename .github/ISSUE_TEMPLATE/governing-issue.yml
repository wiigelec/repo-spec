name: Governing issue
description: Create a standardized governing issue for bounded governed work.
title: "[governed] "
labels:
  - governed-work
body:
  - type: markdown
    attributes:
      value: |
        Use this form to create the canonical governing issue. Required fields must be filled with substantive content; placeholders do not count as complete.
  - type: input
    id: change_type
    attributes:
      label: "Change type"
      description: "Use one canonical bounded change classification. Product-artifact implementation is reserved for changes that create or modify maintained product artifacts."
      placeholder: "Maintenance"
    validations:
      required: true
  - type: textarea
    id: problem_statement
    attributes:
      label: "Problem statement"
      description: "What problem or gap does this issue address?"
      placeholder: "Explain the need in repository terms."
    validations:
      required: true
  - type: textarea
    id: intended_outcome
    attributes:
      label: "Intended outcome"
      description: "What outcome should be true when the work is complete?"
      placeholder: "State the expected end state."
    validations:
      required: true
  - type: textarea
    id: governing_specifications
    attributes:
      label: "Governing specifications"
      description: "List the authoritative specifications and relevant records."
      placeholder: "repo.manifest, repo.development-workflow, and any other governing specs."
    validations:
      required: true
  - type: textarea
    id: implementation_plan_workstreams
    attributes:
      label: "Implementation-plan workstreams/stages"
      description: "For Product-artifact implementation, list one or more stable workstream/stage IDs from the cited accepted implementation plan, one per line."
      placeholder: "I1\nI2"
    validations:
      required: false
  - type: input
    id: accepted_default_branch_base
    attributes:
      label: "Accepted default-branch base"
      description: "Actual repository default branch name and exact accepted revision."
      placeholder: "<default-branch> at <commit>"
    validations:
      required: true
  - type: textarea
    id: in_scope_behavior_and_paths
    attributes:
      label: "In-scope behavior and paths"
      description: "What behavior and repository paths are explicitly in scope?"
      placeholder: "List files, directories, and behavior to change."
    validations:
      required: true
  - type: textarea
    id: explicit_exclusions
    attributes:
      label: "Explicit exclusions"
      description: "What is explicitly out of scope?"
      placeholder: "List excluded behaviors, files, or follow-up work."
    validations:
      required: true
  - type: textarea
    id: dependencies_and_predecessor_evidence
    attributes:
      label: "Dependencies and predecessor evidence"
      description: "What must exist first, and what evidence supports this work?"
      placeholder: "Prior issues, commits, specs, validation evidence, or other predecessors."
    validations:
      required: true
  - type: textarea
    id: ordered_patch_plan
    attributes:
      label: "Ordered patch plan"
      description: "State the implementation steps in order."
      placeholder: "1. ... 2. ... 3. ..."
    validations:
      required: true
  - type: textarea
    id: validation_plan
    attributes:
      label: "Validation plan"
      description: "How will the change be validated?"
      placeholder: "scripts/validate for repository-wide validation; add focused leaf checks and evidence capture as needed."
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "Acceptance criteria"
      description: "What must be true for this issue to be accepted?"
      placeholder: "List concrete acceptance checks."
    validations:
      required: true
  - type: textarea
    id: completion_gate
    attributes:
      label: "Completion gate"
      description: "What must be satisfied before this issue can close?"
      placeholder: "State the closure condition."
    validations:
      required: true
  - type: textarea
    id: open_decisions_or_authority_conflicts
    attributes:
      label: "Open decisions or authority conflicts"
      description: "Record any unresolved authority questions or conflicts."
      placeholder: "None, or list conflicts explicitly."
    validations:
      required: true
  - type: textarea
    id: successor_work_not_authorized
    attributes:
      label: "Successor work explicitly not authorized"
      description: "What follow-on work does this issue not authorize?"
      placeholder: "List unrelated or deferred successor work."
    validations:
      required: true
  - type: textarea
    id: optional_context
    attributes:
      label: "Optional context"
      description: "Optional notes that help with session recovery or review."
      placeholder: "Related links, assumptions, risks, or recovery notes."
    validations:
      required: false
