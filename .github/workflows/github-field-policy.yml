name: GitHub field policy

on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  issue-policy:
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'governed-work')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/github-field-policy --mode issue --event-path "$GITHUB_EVENT_PATH"

  pr-policy:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: scripts/github-field-policy --mode pr --event-path "$GITHUB_EVENT_PATH"
