name: GitHub field policy

on:
  issues:
    types: [opened, edited, reopened, labeled]
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  issue-policy:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 repo/validation/github/github_field_policy.py --mode issue --event-path "$GITHUB_EVENT_PATH"

  pr-policy:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - run: python3 repo/validation/github/github_field_policy.py --mode pr --event-path "$GITHUB_EVENT_PATH"
